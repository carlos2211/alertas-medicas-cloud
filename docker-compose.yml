version: '3.9'

services:
  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    container_name: alertas-bff
    ports:
      - "8080:8080"
    environment:
      AZURE_B2C_TENANT_NAME: ${AZURE_B2C_TENANT_NAME}
      AZURE_B2C_TENANT_ID: ${AZURE_B2C_TENANT_ID}
      AZURE_B2C_CLIENT_ID: ${AZURE_B2C_CLIENT_ID}
      AZURE_B2C_FLOW_NAME: ${AZURE_B2C_FLOW_NAME}
      AZURE_B2C_CLIENT_SECRET: ${AZURE_B2C_CLIENT_SECRET}
      TNS_ADMIN: /app/wallet
    restart: unless-stopped