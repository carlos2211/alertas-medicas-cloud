<div class="sidebar d-flex flex-column p-3" style="width: 240px; min-height: 100vh;">
  
  <div class="text-center mb-4 pt-2">
    <i class="bi bi-heart-pulse-fill text-danger" style="font-size: 2rem;"></i>
    <h5 class="fw-bold mt-2 mb-0">AlertaMédica</h5>
    <small class="opacity-75">Sistema Cloud Native</small>
  </div>

  <hr class="border-light opacity-25">

  <nav class="nav flex-column flex-grow-1">
    <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
      <i class="bi bi-speedometer2 me-2"></i> Dashboard
    </a>
    <a class="nav-link" routerLink="/pacientes" routerLinkActive="active">
      <i class="bi bi-people me-2"></i> Pacientes
    </a>
    <a class="nav-link" routerLink="/alertas" routerLinkActive="active">
      <i class="bi bi-bell me-2"></i> Alertas
    </a>
  </nav>

  <hr class="border-light opacity-25">

  <div class="px-2">
    <div class="d-flex align-items-center gap-2 mb-3">
      <i class="bi bi-person-circle" style="font-size: 1.4rem;"></i>
      <div>
        <div class="fw-semibold" style="font-size: 0.85rem;">{{ userName }}</div>
        <small class="opacity-75">Personal Médico</small>
      </div>
    </div>
    <button class="btn btn-outline-light btn-sm w-100" (click)="logout()">
      <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
    </button>
  </div>

</div>
